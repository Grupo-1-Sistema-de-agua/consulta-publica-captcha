services:
  # Backend Spring Boot: valida el CAPTCHA y consulta los recibos pendientes
  # en la base de datos real del sistema de agua.
  backend:
    build:
      context: ./backend
    container_name: captcha_backend
    restart: unless-stopped
    # Permite llegar a la base de datos publicada en el host de Docker.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      CAPTCHA_TTL_SECONDS: 180
      SPRING_DATASOURCE_URL: "jdbc:mysql://host.docker.internal:3306/agua_db?serverTimezone=America/Guatemala&allowPublicKeyRetrieval=true"
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-agua_user}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-cambiar_password}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 20
      start_period: 30s

  # Frontend Next.js: sirve la página y hace de proxy hacia el backend.
  frontend:
    build:
      context: ./frontend
    container_name: captcha_frontend
    restart: unless-stopped
    environment:
      API_URL: http://backend:8080
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"

  # Túnel temporal de Cloudflare para la presentación.
  # No se inicia con `docker compose up` normal: usa el perfil "tunnel"
  # o el lanzador INICIAR-CAPTCHA-PUBLICO.ps1.
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: captcha_cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://frontend:3000
    depends_on:
      frontend:
        condition: service_started
    profiles:
      - tunnel

