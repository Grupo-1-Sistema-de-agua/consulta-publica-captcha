server.port=8080

# Conexion de solo lectura a la base de datos del sistema de agua.
# En Docker Compose el host es el servicio "db"; fuera de Docker se puede
# apuntar a localhost o a la IP de la base de datos real.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/agua_db?serverTimezone=America/Guatemala&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:agua_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:cambiar_password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.maximum-pool-size=4

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
captcha.ttl-seconds=${CAPTCHA_TTL_SECONDS:180}
spring.jackson.serialization.write-dates-as-timestamps=false
